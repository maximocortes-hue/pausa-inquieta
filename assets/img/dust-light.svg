<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <!-- Polvo y rayones claros para superficies negras (estilo afiche gastado) -->
  <filter id="specks" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .93  0 0 0 0 .92  0 0 0 0 .9  22 0 0 0 -17.3"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="4" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .93  0 0 0 0 .92  0 0 0 0 .9  2.2 0 0 0 -1.3"/>
  </filter>
  <rect width="520" height="520" filter="url(#wear)" opacity=".12"/>
  <rect width="520" height="520" filter="url(#specks)" opacity=".6"/>
  <g stroke="#ecebe5" stroke-linecap="round" fill="none" opacity=".18">
    <path d="M40 0 L52 520" stroke-width=".6"/>
    <path d="M318 0 L310 520" stroke-width=".4"/>
    <path d="M455 30 L470 260" stroke-width=".8"/>
    <path d="M120 300 Q200 280 260 330" stroke-width=".5"/>
  </g>
</svg>
